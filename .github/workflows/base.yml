name: base

on:
  workflow_call:
    inputs:
      proyectos-node:
        description: 'Carpetas con proyectos Node, en JSON. Ejemplo: ["backend","frontend"]'
        required: false
        type: string
        default: '[]'
      proyectos-java:
        description: 'Carpetas con proyectos Maven (pom.xml) o Gradle (gradlew), en JSON'
        required: false
        type: string
        default: '[]'
      proyectos-php:
        description: 'Carpetas con proyectos PHP con Composer y PHPUnit, en JSON'
        required: false
        type: string
        default: '[]'
      imagenes:
        description: 'Contextos de docker build, en JSON. Ejemplo: ["backend","frontend"]'
        required: false
        type: string
        default: '[]'
      mongo:
        description: Arranca mongo:7 y define MONGO_URL en todos los proyectos Node
        required: false
        type: boolean
        default: false
      node-version:
        required: false
        type: string
        default: '22'
      java-version:
        required: false
        type: string
        default: '21'
      php-version:
        required: false
        type: string
        default: '8.3'

permissions:
  contents: read

jobs:
  politica-ramas:
    runs-on: ubuntu-latest
    steps:
      - name: main solo acepta PR desde release/* o hotfix/*
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          RAMA: ${{ github.head_ref }}
        run: |
          case "$RAMA" in
            release/*|hotfix/*) echo "Rama permitida: $RAMA" ;;
            *) echo "::error::A main solo se integra desde release/* o hotfix/*"; exit 1 ;;
          esac

  node:
    if: inputs.proyectos-node != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proyecto: ${{ fromJSON(inputs.proyectos-node) }}
    services:
      mongo:
        # Con imagen vacía GitHub no arranca el servicio.
        image: ${{ inputs.mongo && 'mongo:7' || '' }}
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: ${{ matrix.proyecto }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ matrix.proyecto }}/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          MONGO_URL: ${{ inputs.mongo && 'mongodb://127.0.0.1:27017/test' || '' }}
      - run: npm run build --if-present

  java:
    if: inputs.proyectos-java != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proyecto: ${{ fromJSON(inputs.proyectos-java) }}
    defaults:
      run:
        working-directory: ${{ matrix.proyecto }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: ${{ hashFiles(format('{0}/pom.xml', matrix.proyecto)) != '' && 'maven' || 'gradle' }}
          cache-dependency-path: |
            ${{ matrix.proyecto }}/**/pom.xml
            ${{ matrix.proyecto }}/**/*.gradle*
            ${{ matrix.proyecto }}/**/gradle-wrapper.properties
      - run: |
          if [ -f pom.xml ]; then
            mvn -B verify
          else
            sh ./gradlew build --no-daemon
          fi

  php:
    if: inputs.proyectos-php != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proyecto: ${{ fromJSON(inputs.proyectos-php) }}
    defaults:
      run:
        working-directory: ${{ matrix.proyecto }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
      - run: composer install --no-interaction
      - run: vendor/bin/phpunit

  docker:
    needs: [politica-ramas, node, java, php]
    if: ${{ !failure() && !cancelled() && inputs.imagenes != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contexto: ${{ fromJSON(inputs.imagenes) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build "$CONTEXTO"
        env:
          CONTEXTO: ${{ matrix.contexto }}

  # Check único para exigir en las reglas de rama: su nombre no cambia con la matriz.
  resultado:
    if: always()
    needs: [politica-ramas, node, java, php, docker]
    runs-on: ubuntu-latest
    steps:
      - name: El proyecto declara algo que construir
        if: inputs.proyectos-node == '[]' && inputs.proyectos-java == '[]' && inputs.proyectos-php == '[]' && inputs.imagenes == '[]'
        run: |
          echo "::error::No hay proyectos ni imágenes: el pipeline no comprobaría nada"
          exit 1
      - run: test "$CORRECTO" = "true"
        env:
          CORRECTO: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
