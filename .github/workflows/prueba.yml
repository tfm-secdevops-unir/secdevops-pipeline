name: prueba

on: push

permissions:
  contents: read

jobs:
  base:
    uses: ./.github/workflows/base.yml
    with:
      proyectos-node: '["pruebas/node"]'
      proyectos-java: '["pruebas/maven","pruebas/gradle"]'
      proyectos-php: '["pruebas/php"]'
      imagenes: '["pruebas/docker"]'

  # Un proyecto con un solo lenguaje: los demás jobs se omiten y el resultado debe seguir en verde.
  solo-php:
    uses: ./.github/workflows/base.yml
    with:
      proyectos-php: '["pruebas/php"]'

  # Casos de lógica de la puerta (E01 a E04, P01 a P03) y reglas R1 a R10.
  puerta:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 scripts/test_puerta.py

  # El pipeline seguro sobre los mismos proyectos, sin cambiar la plantilla.
  seguro:
    uses: ./.github/workflows/seguro.yml
    permissions:
      contents: read
      id-token: write
      security-events: write
    with:
      proyectos-node: '["pruebas/node"]'
      proyectos-java: '["pruebas/maven","pruebas/gradle"]'
      proyectos-php: '["pruebas/php"]'
      imagenes: '["pruebas/docker","pruebas/php","pruebas/maven"]'
      semgrep-config: p/java p/php p/javascript p/nodejs p/owasp-top-ten
